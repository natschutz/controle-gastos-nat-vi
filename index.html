<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gastos Nat e Vi</title>
<link rel="apple-touch-icon" href="apple-touch-icon.PNG">
<link rel="icon" type="image/png" href="apple-touch-icon.PNG">
<style>
  :root { --bg:#fafafa; --fg:#111; --muted:#6b6b6b; --line:#e4e4e4; --head:#111; --head-fg:#fff; --zebra:#f3f3f3; --card:#fff; --neg:#b00020; --pos:#0a7a3a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f0f0f; --fg:#f2f2f2; --muted:#9a9a9a; --line:#2a2a2a; --head:#f2f2f2; --head-fg:#0f0f0f; --zebra:#171717; --card:#151515; --neg:#ff6b6b; --pos:#5fd38d; }
  }
  * { box-sizing:border-box; }
  html { scrollbar-gutter:stable; }
  body { margin:0; padding:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  /* Cabeçalho com navegação */
  nav.topo { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
  nav.topo h1 { font-size:18px; margin:0; font-weight:600; }
  .abas { display:flex; flex-wrap:wrap; gap:6px; margin-left:auto; }
  .abas button { font:inherit; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  .abas button.ativa { background:var(--head); color:var(--head-fg); border-color:var(--head); }

  main { padding:20px 24px 32px; }
  section.visao { display:none; }
  section.visao.ativa { display:block; }
  .meta { font-size:13px; color:var(--muted); margin:0 0 12px; }
  #erro { color:var(--neg); white-space:pre-wrap; margin:0 0 12px; }
  #fallback { display:none; margin:0 0 16px; padding:14px; border:1px dashed var(--line); border-radius:10px; }

  .wrap { overflow:auto; border:1px solid var(--line); border-radius:10px; background:var(--card); display:inline-block; max-width:100%; vertical-align:top; }
  table { border-collapse:collapse; width:auto; font-size:14px; font-variant-numeric:tabular-nums; }
  th, td { padding:9px 12px; text-align:center; vertical-align:middle; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { position:sticky; top:0; background:var(--head); color:var(--head-fg); font-weight:600; z-index:1; }
  th:first-child, td:first-child { text-align:left; position:sticky; left:0; background:var(--card); }
  th:first-child { background:var(--head); z-index:2; }
  tr.ano, tr.cv-linha { cursor:pointer; }
  .seta { display:inline-block; vertical-align:middle; margin-left:6px; transition:transform .2s; }
  tr.aberto .seta { transform:rotate(180deg); }
  tr.fechado { display:none; }
  tr.detalhe td { font-size:12px; color:var(--muted); }
  td.soma-ano { font-weight:800; }
  #t-dividas-rend th:first-child, #t-dividas-rend td:first-child { text-align:center; position:static; }
  #t-cartoes th, #t-cartoes td { width:90px; }
  #t-cartoes th:first-child, #t-cartoes td:first-child { width:110px; }
  tr.ano td { background:transparent !important; font-weight:800; color:var(--fg); font-size:15px; padding-top:18px; }
  tr.ano td:first-child { background:var(--card) !important; }
  tr.total td { font-weight:600; border-top:2px solid var(--fg); border-bottom:none; }
  td.zero { color:var(--muted); }
  td.parc { color:var(--muted); }
  .neg { color:var(--pos); }
  .pos { color:var(--pos); }
  .vazio { padding:14px; color:var(--muted); font-size:14px; }

  /* Gastos */
  .gastos-topo { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:14px; }
  .gastos-topo label { font-size:14px; color:var(--muted); }
  input[type=month] { font:inherit; width:260px; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  #banner { padding:16px 18px; border-radius:12px; background:var(--card); border:1px solid var(--line); margin-bottom:16px; width:260px; max-width:100%; }
  #banner .rotulo { font-size:16px; color:var(--muted); }
  #banner .valor { font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; }
  .grade { display:grid; grid-template-columns: repeat(3, max-content); gap:32px; align-items:start; }
  @media (max-width: 900px) {
    .grade { grid-template-columns: 1fr; gap:12px; }
    .grade .caixa { display:block; }
    #g-nat table, #g-vi table { width:100%; table-layout:fixed; }
    #g-nat th:first-child, #g-nat td:first-child, #g-vi th:first-child, #g-vi td:first-child { width:46%; }
    #g-nat td, #g-vi td { white-space:normal; }
    #caixa-cartoes-vi { display:inline-block; }
  }
  .caixa { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); display:inline-block; max-width:100%; vertical-align:top; }
  .titulo-caixa { margin:0 0 8px; padding:0 12px; font-size:15px; font-weight:600; }
  .titulo-param { margin:32px 0 8px; font-size:15px; font-weight:600; }
  .campo-mes { position:relative; display:inline-block; }
  .campo-mes input[type=month] { width:300px; padding-right:96px; text-align:left; white-space:nowrap; -webkit-appearance:none; appearance:none; }
  input[type=month]::-webkit-calendar-picker-indicator { display:none; }
  input[type=month]::-webkit-datetime-edit-fields-wrapper { display:flex; justify-content:flex-start; width:100%; }
  input[type=month]::-webkit-datetime-edit { padding:0; }
  .setas-mes { position:absolute; right:8px; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:2px; }
  .setas-mes button { border:none; background:transparent; padding:0 4px; font-size:18px; line-height:1; color:var(--fg); cursor:pointer; }
  .setas-mes button.icone-cal { padding:2px 4px; display:flex; align-items:center; }
  .grupo-mes { display:flex; align-items:center; gap:6px; }
  .rot { font-size:14px; color:var(--muted); width:52px; flex:0 0 52px; text-align:right; }
  #v-mes-x-mes .gastos-topo { gap:12px 32px; }
  #v-mes-x-mes .grupo-mes { gap:6px; }
  #v-mes-x-mes .rot { width:auto; flex:0 0 auto; text-align:left; }
  .seletor-aba { display:none; font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); margin-left:auto; }
  .dividas-tabelas { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; }
  .dividas-tabelas > .wrap { flex:0 0 auto; }

  /* Dívidas */
  .params { display:flex; flex-wrap:wrap; gap:12px; margin:0 0 16px; }
  .param { border:1px solid var(--line); border-radius:10px; padding:10px 14px; background:var(--card); min-width:260px; }
  .param .l { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .param .v { font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }
  button { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primario { background:var(--head); color:var(--head-fg); border-color:var(--head); }
  form#formDiv { display:grid; grid-template-columns: 2fr 1fr 1fr auto; gap:10px; margin-top:16px; align-items:end; }
  form#formDiv label { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  form#formDiv input { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  .botoes { display:flex; gap:8px; }
  @media (max-width: 700px) { form#formDiv { grid-template-columns: 1fr; } }
  td.acoes { text-align:right; white-space:nowrap; }
  .rodape { margin-top:12px; font-size:12px; color:var(--muted); }
  .marca { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .marca #meta { margin:0; }
  @media (max-width: 700px) {
    nav.topo { padding:10px 12px; }
    main { padding:14px 12px 24px; }
    th, td { padding:7px 8px; font-size:13px; }
    .abas button { padding:6px 10px; font-size:13px; }
    #banner .valor { font-size:20px; }
    .titulo-caixa { padding:0 8px; }
    .abas { display:none; }
    .seletor-aba { display:block; }
    #v-mes-x-mes .rot { width:52px; flex:0 0 52px; }
    #v-mes-x-mes .campo-mes input[type=month] { width:260px; padding-right:84px; }
  }
</style>
</head>
<body>

<nav class="topo">
  <div class="marca">
    <h1>Gastos Nat e Vi</h1>
    <button id="btnAtualizar" style="display:none">Atualizar (Nat)</button>
    <span id="meta" class="meta">Carregando…</span>
  </div>
  <div class="abas" id="abas">
    <button data-aba="cartoes">Cartões</button>
    <button data-aba="gastos">Gastos</button>
    <button data-aba="mes-x-mes">Mês x Mês</button>
    <button data-aba="dividas">Dívidas</button>
  </div>
  <select id="selAba" class="seletor-aba" aria-label="Escolha a aba">
    <option value="cartoes">Cartões</option>
    <option value="gastos">Gastos</option>
    <option value="mes-x-mes">Mês x Mês</option>
    <option value="dividas">Dívidas</option>
  </select>
</nav>

<main>
  <div id="fallback">
    <label>Escolha o arquivo <strong>Controle_Mensal.xlsx</strong> (modo local): <input type="file" id="arquivo" accept=".xlsx"></label>
  </div>
  <div id="erro"></div>

  <!-- CARTÕES -->
  <section class="visao" id="v-cartoes">
    <div class="wrap"><table id="t-cartoes"></table></div>
  </section>

  <!-- GASTOS -->
  <section class="visao" id="v-gastos">
    <div class="gastos-topo">
      <div class="campo-mes">
        <input type="month" id="mes" aria-label="Mês">
        <span class="setas-mes">
          <button type="button" data-passo="-1" data-alvo="mes" aria-label="Mês anterior">‹</button>
          <button type="button" data-passo="1" data-alvo="mes" aria-label="Próximo mês">›</button>
          <button type="button" class="icone-cal" data-calendario="mes" aria-label="Abrir calendário"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
        </span>
      </div>
    </div>
    <div id="banner" style="display:none;">
      <div class="rotulo" id="bRotulo"></div>
      <div class="valor" id="bValor"></div>
    </div>
    <div class="grade">
      <div><h2 class="titulo-caixa">Nat</h2><div class="caixa"><div id="g-nat"></div></div></div>
      <div><h2 class="titulo-caixa">Vi</h2><div class="caixa"><div id="g-vi"></div></div></div>
      <div><h2 class="titulo-caixa">Cartões Vi</h2><div class="caixa" id="caixa-cartoes-vi"><div id="g-cartoes"></div></div></div>
    </div>
  </section>

  <!-- MÊS X MÊS -->
  <section class="visao" id="v-mes-x-mes">
    <div class="gastos-topo">
      <div class="grupo-mes">
        <span class="rot">Início</span>
        <div class="campo-mes">
          <input type="month" id="mxmInicio">
          <span class="setas-mes">
            <button type="button" data-passo="-1" data-alvo="mxmInicio" aria-label="Mês anterior">‹</button>
            <button type="button" data-passo="1" data-alvo="mxmInicio" aria-label="Próximo mês">›</button>
            <button type="button" class="icone-cal" data-calendario="mxmInicio" aria-label="Abrir calendário"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
          </span>
        </div>
      </div>
      <div class="grupo-mes">
        <span class="rot">Fim</span>
        <div class="campo-mes">
          <input type="month" id="mxmFim">
          <span class="setas-mes">
            <button type="button" data-passo="-1" data-alvo="mxmFim" aria-label="Mês anterior">‹</button>
            <button type="button" data-passo="1" data-alvo="mxmFim" aria-label="Próximo mês">›</button>
            <button type="button" class="icone-cal" data-calendario="mxmFim" aria-label="Abrir calendário"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
          </span>
        </div>
      </div>
    </div>
    <div class="wrap"><table id="t-mxm"></table></div>
  </section>

  <!-- DÍVIDAS -->
  <section class="visao" id="v-dividas">
    <div class="dividas-tabelas">
      <div class="wrap"><table id="t-dividas"></table></div>
      <div class="wrap"><table id="t-dividas-rend"></table></div>
    </div>
    <h2 class="titulo-param">Parâmetros Rendimento Estimado</h2>
    <div class="params">
      <div class="param"><div class="l">Rendimento por dia útil a cada 1 real</div><div class="v" id="p-taxa">-</div></div>
      <div class="param"><div class="l">Data para o cálculo final de dias úteis</div><div class="v" id="p-data">-</div></div>
    </div>
    <form id="formDiv">
      <label>Descrição <input id="dDesc" type="text" required></label>
      <label>Data <input id="dData" type="date" required></label>
      <label>Valor (pagamento negativo) <input id="dValor" type="number" step="0.01" required></label>
      <div class="botoes">
        <button type="submit" class="primario" id="dSalvar">Adicionar</button>
        <button type="button" id="dCancelar" style="display:none;">Cancelar</button>
      </div>
    </form>
    <div class="rodape" id="r-dividas"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>

<script>
/* =========================================================
   CONFIGURAÇÃO
   CLIENT_ID vazio = modo local (Dívidas somente leitura).
   Com CLIENT_ID, lê e grava no Controle_Mensal.xlsx do OneDrive.
   ========================================================= */
const CONFIG = {
  CLIENT_ID: "4aaf9183-a364-4fa5-95f3-06b40bbde3d6",
  FILE_PATH: "Documentos/Importante/Controle Mensal.xlsx",
  ALIAS: { "Black": "Essential" },           // mesmo cartão com nome diferente entre anos
  VI_LABELS: ["vitor", "vi"],                // rótulo do bloco da Vi (linha 4)
  ABA_ACERTOS: "Acertos Nat x Vi",
  ABA_DIVIDAS: "Dívidas Vi",
  SCOPES: ["Files.ReadWrite"],
  GH_REPO: "natschutz/controle-gastos-nat-vi",   // repositório onde fica a cópia cifrada
  SNAPSHOT_PATH: "data.json",                    // nome do arquivo cifrado no repositório
};

const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESES_LONGO = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const BRL = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const $ = (id) => document.getElementById(id);
const ymKey = (y, m) => `${y}-${String(m).padStart(2, "0")}`;
const EPOCA = Date.UTC(1899, 11, 30);
const DIA = 86400000;

/* Data e hora no formato dd/mm/aaaa às hh:mm */
function formatarQuando(iso) {
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} às ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* Aba Gastos abre sempre no mês seguinte ao mês atual */
function mesSeguinte() {
  const d = new Date();
  const m = d.getMonth() + 2; // getMonth é 0-based
  const y = d.getFullYear() + (m > 12 ? 1 : 0);
  return ymKey(y, m > 12 ? m - 12 : m);
}

/* ---------- Estado compartilhado ---------- */
const estado = {
  wb: null,                 // workbook com as abas de ano e Acertos (leitura)
  cards: null,              // { byMonth, order }
  acertos: null,            // { rows, monthKeys }
  totais: null,             // Map mês -> { Nat, Vi }
  div: null,                // { matriz, taxa, modelo }
  escrita: false,           // grava no OneDrive?
  editando: null,           // linha em edição na Dívidas
  mesGastos: mesSeguinte(),
  aba: "cartoes",
  // OneDrive
  msal: null, token: null, itemId: null,
};

/* ---------- Datas ---------- */
function ymFromCell(v) {
  if (typeof v === "number" && v > 20000 && v < 100000) {
    const d = XLSX.SSF.parse_date_code(v);
    return d ? { y: d.y, m: d.m } : null;
  }
  if (typeof v === "string") {
    const mm = v.trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (mm) return { y: Number(mm[3]), m: Number(mm[2]) };
  }
  return null;
}
const serialDeData = (s) => new Date(EPOCA + s * DIA);
const dataDeSerial = (s) => {
  const d = serialDeData(s);
  return `${String(d.getUTCDate()).padStart(2, "0")}/${String(d.getUTCMonth() + 1).padStart(2, "0")}/${d.getUTCFullYear()}`;
};
const serialDeInput = (iso) => {
  const [y, m, d] = iso.split("-").map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - EPOCA) / DIA);
};
const serialHoje = () => {
  const h = new Date();
  return Math.round((Date.UTC(h.getFullYear(), h.getMonth(), h.getDate()) - EPOCA) / DIA);
};

/* ---------- Leitura: cartões da Vi por ano ---------- */
function lerCartoes(wb) {
  const byMonth = new Map();
  const order = [];
  const anos = wb.SheetNames.filter(n => /^\d{4}$/.test(n)).sort();
  for (const nome of anos) {
    const ws = wb.Sheets[nome];
    if (!ws || !ws["!ref"]) continue;
    const rng = XLSX.utils.decode_range(ws["!ref"]);
    const y = Number(nome);
    const get = (r, c) => { const cell = ws[XLSX.utils.encode_cell({ r, c })]; return cell ? cell.v : undefined; };
    let vit = -1;
    for (let c = rng.s.c; c <= rng.e.c; c++) {
      const v = get(3, c);
      if (typeof v === "string" && CONFIG.VI_LABELS.includes(v.trim().toLowerCase())) { vit = c; break; }
    }
    if (vit < 0) continue;
    const cards = [];
    for (let c = vit; c <= rng.e.c; c++) {
      const lab = get(4, c);
      if (lab === undefined || lab === null || String(lab).trim() === "") {
        if (c > vit && get(3, c) !== undefined && get(3, c) !== "") break;
        continue;
      }
      const s = String(lab).trim();
      if (/^(cart[aã]o|total)/i.test(s)) break;
      cards.push({ c, name: CONFIG.ALIAS[s] || s });
    }
    for (const k of cards) if (!order.includes(k.name)) order.push(k.name);
    for (let r = 5; r <= rng.e.r; r++) {
      const raw = get(r, 2);
      if (typeof raw !== "number" || raw < 20000 || raw > 100000) continue;
      const d = XLSX.SSF.parse_date_code(raw);
      if (!d || d.y !== y) continue;
      const row = byMonth.get(ymKey(y, d.m)) || {};
      for (const k of cards) {
        const v = get(r, k.c);
        row[k.name] = typeof v === "number" ? v : 0;
      }
      byMonth.set(ymKey(y, d.m), row);
    }
  }
  return { byMonth, order };
}

/* ---------- Leitura: lançamentos e totais da aba Acertos ---------- */
function lerAcertos(wb) {
  const ws = wb.Sheets[CONFIG.ABA_ACERTOS];
  if (!ws || !ws["!ref"]) throw new Error(`Aba "${CONFIG.ABA_ACERTOS}" não encontrada no arquivo.`);
  const rng = XLSX.utils.decode_range(ws["!ref"]);
  const get = (r, c) => { const cell = ws[XLSX.utils.encode_cell({ r, c })]; return cell ? cell.v : undefined; };
  const monthCols = [];
  for (let c = 0; c <= rng.e.c; c++) {
    const ym = ymFromCell(get(0, c));
    if (ym) monthCols.push({ c, key: ymKey(ym.y, ym.m) });
  }
  const rows = [];
  const totais = new Map();
  for (let r = 1; r <= rng.e.r; r++) {
    const who = get(r, 1), compra = get(r, 2);
    if (who === undefined) continue;
    const pessoa = String(who).trim();
    const months = new Map();
    for (const mc of monthCols) {
      const v = get(r, mc.c);
      if (v === undefined || v === null || v === "" || v === "-") continue;
      const num = typeof v === "number" ? v : (Number(v) || 0);
      months.set(mc.key, num);
      if (pessoa === "Nat" || pessoa === "Vi") {
        const t = totais.get(mc.key) || { Nat: 0, Vi: 0 };
        t[pessoa] += num;
        totais.set(mc.key, t);
      }
    }
    if (compra === undefined) continue;
    rows.push({
      who: pessoa,
      compra: String(compra).trim(),
      parcelas: get(r, 4),
      primeira: ymFromCell(get(r, 5)),
      months,
    });
  }
  const monthKeys = [...new Set(monthCols.map(m => m.key))].sort();
  return { acertos: { rows, monthKeys }, totais };
}

/* ---------- Visão Gastos (replica as fórmulas da aba Gastos) ---------- */
function gastosDoMes(acertos, cards, key) {
  const [sy, sm] = key.split("-").map(Number);
  const itens = (who) => acertos.rows
    .filter(r => r.who === who && r.months.has(key))
    .map(r => {
      let parcela = "";
      if (r.parcelas === "recorrente") parcela = "recorrente";
      else if (r.primeira) parcela = `${(sy - r.primeira.y) * 12 + (sm - r.primeira.m) + 1}/${r.parcelas}`;
      return { compra: r.compra, parcela, valor: r.months.get(key) };
    });
  const nat = itens("Nat"), vi = itens("Vi");
  const cardRow = cards.byMonth.get(key) || {};
  const cartoes = cards.order.map(n => ({ cartao: n, valor: cardRow[n] || 0 }));
  const totNat = nat.reduce((s, x) => s + x.valor, 0);
  const totVi = vi.reduce((s, x) => s + x.valor, 0);
  const totCartoes = cartoes.reduce((s, x) => s + x.valor, 0);
  const diff = totNat - totVi + totCartoes;
  return {
    nat, vi, cartoes, totNat, totVi, totCartoes,
    rotulo: diff < 0 ? "Nat transfere pro Vi:" : "Vi transfere pra Nat:",
    valor: Math.abs(diff),
  };
}

/* ---------- Visão Mês x Mês ---------- */
function montarLinhas(totais, cards) {
  const chaves = new Set([...totais.keys(), ...cards.byMonth.keys()]);
  if (!chaves.size) return [];
  const ordenadas = [...chaves].sort();
  const [sy, sm] = ordenadas[0].split("-").map(Number);
  const [ey, em] = ordenadas[ordenadas.length - 1].split("-").map(Number);
  const linhas = [];
  let y = sy, m = sm;
  while (y < ey || (y === ey && m <= em)) {
    const key = ymKey(y, m);
    const t = totais.get(key) || { Nat: 0, Vi: 0 };
    const c = cards.byMonth.get(key) || {};
    const porCartao = cards.order.map(n => c[n] || 0);
    const cartoesVi = porCartao.reduce((s, v) => s + v, 0);
    linhas.push({ y, m, nat: t.Nat, vi: t.Vi, cartoesVi, porCartao, saldo: t.Nat - t.Vi + cartoesVi });
    m++; if (m > 12) { m = 1; y++; }
  }
  return linhas;
}

/* ---------- Dívidas: cálculo (mesma regra da aba) ---------- */
// matriz[i] = linha i+1, colunas A..G (índices 0..6)
function diasUteis(a, b) {
  if (b < a) return -diasUteis(b, a);
  let n = 0;
  for (let s = a; s <= b; s++) {
    const dow = serialDeData(s).getUTCDay();
    if (dow !== 0 && dow !== 6) n++;
  }
  return n;
}

function calcularDividas(matriz, taxa, hoje) {
  const cel = (r, c) => {
    const row = matriz[r - 1] || [];
    const v = row[c];
    return v === undefined || v === null || v === "" ? null : v;
  };
  let tot = null;
  for (let r = 3; r <= matriz.length + 1; r++) {
    if (cel(r, 2) === "Total") { tot = r; break; }
  }
  const fim = tot ? tot - 1 : matriz.length;
  const linhas = [];
  let acumulado = 0;
  for (let r = 3; r <= fim; r++) {
    const valor = typeof cel(r, 2) === "number" ? cel(r, 2) : 0;
    acumulado += valor;
    const descricao = cel(r, 0), data = cel(r, 1);
    if (descricao === null && data === null && cel(r, 2) === null) continue;
    const proxima = cel(r + 1, 1);
    const ate = proxima === null ? hoje : proxima;
    const dias = data === null ? null : diasUteis(data, ate);
    const estimado = dias === null ? null : dias * taxa * acumulado;
    linhas.push({
      row: r, descricao: descricao === null ? "" : String(descricao),
      data, valor: cel(r, 2) === null ? null : valor, saldo: acumulado, dias, estimado,
    });
  }
  const estimadoTotal = linhas.reduce((s, l) => s + (l.estimado || 0), 0);
  return { tot, linhas, saldoFinal: acumulado, estimadoTotal };
}

  const anoHoje = new Date().getFullYear();
  const somas = new Map();
  for (const k of meses) {
    const y = k.slice(0, 4);

    const r = cards.byMonth.get(k) || {};
    cards.order.forEach(n => { acc[n] = (acc[n] || 0) + (r[n] || 0); });
    somas.set(y, acc);
  }

  tabela.innerHTML = html + "</tbody>";

    const tr = ev.target.closest("tr.ano");
    if (!tr) return;
    tr.classList.toggle("aberto");
    tabela.querySelectorAll(`tr.linha-mes[data-ano="${tr.dataset.ano}"]`).forEach(r => r.classList.toggle("fechado"));

/* ---------- Microsoft Graph (OneDrive) ---------- */
async function garantirMsal() {
  if (!estado.msal) {
    estado.msal = new msal.PublicClientApplication({
      auth: {
        clientId: CONFIG.CLIENT_ID,
        authority: "https://login.microsoftonline.com/consumers",
        redirectUri: window.location.origin + window.location.pathname,
      },
      cache: { cacheLocation: "localStorage" },
    });
    await estado.msal.initialize();
    // Volta do login da Microsoft (fluxo por redirecionamento, sem pop-up)
    estado.retorno = await estado.msal.handleRedirectPromise();
  }
  return estado.msal;
}

async function obterToken(interativo) {
  const m = await garantirMsal();
  const r = estado.retorno;
  estado.retorno = null;
  if (r && r.accessToken) return r.accessToken;
  const conta = m.getAllAccounts()[0];
  if (conta) {
    try { return (await m.acquireTokenSilent({ scopes: CONFIG.SCOPES, account: conta })).accessToken; } catch (e) { /* segue para o login */ }
  }
  if (interativo) await m.loginRedirect({ scopes: CONFIG.SCOPES }); // a página vai para o login da Microsoft
  return null;
}

async function gfetch(metodo, url, corpo) {
  const resp = await fetch(url, {
    method: metodo,
    headers: { Authorization: `Bearer ${estado.token}`, "Content-Type": "application/json" },
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  if (!resp.ok) throw new Error(`Erro ao falar com o OneDrive (${resp.status}): ${await resp.text()}`);
  return resp.status === 204 ? null : resp.json();
}

function baseWorkbook() {
  return `${estado.urlItem}/workbook/worksheets('${encodeURIComponent(CONFIG.ABA_DIVIDAS)}')`;
}

async function recarregarDividasOneDrive() {
  const base = baseWorkbook();
  const range = await gfetch("GET", `${base}/range(address='A1:G200')`);
  const taxa = (await gfetch("GET", `${base}/range(address='K1')`)).values[0][0];
  estado.div = { matriz: range.values, taxa, modelo: calcularDividas(range.values, taxa, serialHoje()) };
}

// Inclui uma linha: usa a primeira linha livre antes do Total, ou insere uma antes dele
async function adicionarLinha(base, modelo, desc, serial, valor) {
  const ultimaLinha = modelo.linhas.length ? modelo.linhas[modelo.linhas.length - 1].row : 2;
  let r;
  if (modelo.tot && ultimaLinha + 1 < modelo.tot) {
    r = ultimaLinha + 1;
  } else {
    r = modelo.tot || ultimaLinha + 1;
    if (modelo.tot) {
      await gfetch("POST", `${base}/range(address='A${modelo.tot}:G${modelo.tot}')/insert`, { shift: "Down" });
      await reescreverTotal(base);
    }
  }
  await gfetch("PATCH", `${base}/range(address='A${r}:C${r}')`, { values: [[desc, serial, valor]] });
  await gfetch("PATCH", `${base}/range(address='D${r}')`, { formulas: [[`=SUM($C$3:C${r})`]] });
  await gfetch("PATCH", `${base}/range(address='F${r}')`, { formulas: [[`=IF(B${r}="","",NETWORKDAYS(B${r},IF(B${r + 1}="",$K$2,B${r + 1})))`]] });
  await gfetch("PATCH", `${base}/range(address='G${r}')`, { formulas: [[`=IF(D${r}="","",(F${r}*$K$1)*D${r})`]] });
}

// Ajusta as fórmulas da linha de Total depois de inserir ou excluir linhas
async function reescreverTotal(base) {
  const range = await gfetch("GET", `${base}/range(address='A1:G200')`);
  let tot = null;
  for (let r = 3; r <= range.values.length + 1; r++) {
    if ((range.values[r - 1] || [])[2] === "Total") { tot = r; break; }
  }
  if (!tot) return;
  const ult = tot - 1;
  await gfetch("PATCH", `${base}/range(address='G${tot}')`, { formulas: [[`=SUM(G3:G${ult})`]] });
  await gfetch("PATCH", `${base}/range(address='D${tot}')`, { formulas: [[`=LOOKUP(2,1/(D3:D${ult}<>""),D3:D${ult})`]] });
}

/* Nat: lê o OneDrive, atualiza a tela e publica a cópia cifrada para o Vi */
async function sincronizarOneDrive() {
  $("meta").textContent = "Atualizando do OneDrive…";
  estado.token = await obterToken(true);
  if (!estado.token) return; // a página está indo para o login da Microsoft
  const item = await gfetch("GET", `https://graph.microsoft.com/v1.0/me/drive/root:/${encodeURI(CONFIG.FILE_PATH)}`);
  estado.urlItem = `https://graph.microsoft.com/v1.0/me/drive/items/${item.id}`;
  const resp = await fetch(`${estado.urlItem}/content`, {
    headers: { Authorization: `Bearer ${estado.token}` },
  });
  if (!resp.ok) throw new Error(`Não consegui baixar o arquivo do OneDrive (${resp.status}).`);
  const bytes = new Uint8Array(await resp.arrayBuffer());
  processar(XLSX.read(bytes, { type: "array" }));
  await recarregarDividasOneDrive();
  estado.escrita = true;
  atualizarVisao();
  $("meta").textContent = `Dados atualizados em ${formatarQuando(new Date().toISOString())}.`;
  try {
    await publicarSnapshot(bytes);
  } catch (e) {
    $("erro").textContent = "Dados atualizados, mas não consegui publicar a versão do Vi: " + (e.message || e);
  }
}

/* Vi: lê a cópia cifrada publicada e pede a senha */
async function carregarSnapshot() {
  const resp = await fetch(`./${CONFIG.SNAPSHOT_PATH}?t=${Date.now()}`, { cache: "no-store" });
  if (!resp.ok) throw new Error("Ainda não há dados publicados. Peça para a Nat atualizar.");
  const obj = await resp.json();
  const senha = window.prompt("Senha de acesso:");
  if (!senha) throw new Error("Digite a senha para ver os dados.");
  let bytes;
  try { bytes = await decifrar(obj, senha); } catch (e) { throw new Error("Senha incorreta."); }
  carregarLocal(XLSX.read(bytes, { type: "array" }));
  estado.escrita = false;
  atualizarVisao();
  const quando = obj.publicadoEm ? formatarQuando(obj.publicadoEm) : "";
  $("meta").textContent = `Dados atualizados em ${quando}.`;
}

/* Cifra o arquivo e envia para o repositório do GitHub */
async function publicarSnapshot(bytes) {
  const senha = window.prompt("Senha para a versão do Vi (a mesma que ele vai digitar):");
  if (!senha) return "(versão do Vi não publicada: sem senha)";
  const token = localStorage.getItem("ghToken") || window.prompt("Cole o token do GitHub (só na primeira vez):");
  if (!token) return "(versão do Vi não publicada: sem token)";
  localStorage.setItem("ghToken", token);
  const url = `https://api.github.com/repos/${CONFIG.GH_REPO}/contents/${CONFIG.SNAPSHOT_PATH}`;
  const cab = { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" };
  let sha;
  const atual = await fetch(url, { headers: cab });
  if (atual.ok) sha = (await atual.json()).sha;
  const obj = { publicadoEm: new Date().toISOString(), ...(await cifrar(bytes, senha)) };
  const put = await fetch(url, {
    method: "PUT",
    headers: { ...cab, "Content-Type": "application/json" },
    body: JSON.stringify({ message: "Atualiza dados", content: btoa(JSON.stringify(obj)), sha }),
  });
  if (!put.ok) throw new Error(`GitHub recusou a publicação (${put.status}).`);
  return "Versão do Vi atualizada.";
}

/* Cifragem com senha (AES-GCM, chave derivada com PBKDF2) */
function bytesParaB64(u8) { let s = ""; for (const x of u8) s += String.fromCharCode(x); return btoa(s); }
function b64ParaBytes(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function derivarChave(senha, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function cifrar(bytes, senha) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const chave = await derivarChave(senha, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, chave, bytes));
  return { v: 1, salt: bytesParaB64(salt), iv: bytesParaB64(iv), data: bytesParaB64(ct) };
}
async function decifrar(obj, senha) {
  const chave = await derivarChave(senha, b64ParaBytes(obj.salt));
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ParaBytes(obj.iv) }, chave, b64ParaBytes(obj.data));
  return new Uint8Array(pt);
}

function carregarLocal(wb) {
  processar(wb);
  const ws = wb.Sheets[CONFIG.ABA_DIVIDAS];
  if (!ws) throw new Error(`Aba "${CONFIG.ABA_DIVIDAS}" não encontrada no arquivo.`);
  const matriz = XLSX.utils.sheet_to_json(ws, { header: 1, range: "A1:G200", defval: "", raw: true });
  const taxa = ws["K1"] ? ws["K1"].v : 0;
  estado.div = { matriz, taxa, modelo: calcularDividas(matriz, taxa, serialHoje()) };
  estado.escrita = false;
}

/* ---------- Navegação ---------- */
function atualizarVisao() {
  const aba = estado.aba;
  $("selAba").value = aba;
  document.querySelectorAll("#abas button").forEach(b => b.classList.toggle("ativa", b.dataset.aba === aba));
  document.querySelectorAll("section.visao").forEach(s => s.classList.toggle("ativa", s.id === `v-${aba}`));
  if (!estado.cards) return;   // ainda sem arquivo
  if (aba === "cartoes") renderCartoes();
  if (aba === "gastos") renderGastos();
  if (aba === "mes-x-mes") renderMesXMes();
  if (aba === "dividas") renderDividas();
}

function irPara(aba) {
  estado.aba = aba;
  try { history.replaceState(null, "", `#${aba}`); } catch (e) { /* ambiente que bloqueia a URL (ex.: visualizador) */ }
  atualizarVisao();
}

document.querySelectorAll("#abas button").forEach(b => b.onclick = () => irPara(b.dataset.aba));
$("selAba").addEventListener("change", (e) => irPara(e.target.value));
$("mes").addEventListener("change", () => { estado.mesGastos = $("mes").value; renderGastos(); });
$("mxmInicio").addEventListener("change", () => renderMesXMes());
$("mxmFim").addEventListener("change", () => renderMesXMes());

/* Ícone de calendário: abre o seletor nativo do campo */
document.querySelectorAll("[data-calendario]").forEach(b => b.addEventListener("click", () => {
  const c = $(b.dataset.calendario);
  if (c.showPicker) c.showPicker(); else c.focus();
}));

/* Setinhas ‹ e › dos campos de mês: avançam ou voltam um mês */
document.querySelectorAll("[data-passo]").forEach(b => b.addEventListener("click", () => {
  const campo = $(b.dataset.alvo);
  const hoje = new Date();
  const [y, m] = (campo.value || ymKey(hoje.getFullYear(), hoje.getMonth() + 1)).split("-").map(Number);
  const d = new Date(y, m - 1 + Number(b.dataset.passo), 1);
  campo.value = ymKey(d.getFullYear(), d.getMonth() + 1);
  campo.dispatchEvent(new Event("change"));
}));

/* ---------- Início ---------- */
async function iniciar() {
  const hash = location.hash.replace("#", "");
  if (["cartoes", "gastos", "mes-x-mes", "dividas"].includes(hash)) estado.aba = hash;
  $("mes").value = estado.mesGastos;
  try {
    if (CONFIG.CLIENT_ID) {
      const m = await garantirMsal();
      $("btnAtualizar").style.display = "inline-block";
      $("btnAtualizar").onclick = () => sincronizarOneDrive().catch(e => { $("erro").textContent = e.message || String(e); });
      const temSessao = (estado.retorno && estado.retorno.accessToken) || m.getAllAccounts().length > 0;
      if (temSessao) {
        await sincronizarOneDrive();
      } else {
        await carregarSnapshot();
      }
    } else {
      $("fallback").style.display = "block";
      $("meta").textContent = "Aguardando arquivo";
      $("arquivo").addEventListener("change", async (ev) => {
        const f = ev.target.files[0];
        if (!f) return;
        try {
          carregarLocal(XLSX.read(await f.arrayBuffer(), { type: "array" }));
          $("meta").textContent = "Modo leitura (arquivo local).";
          $("erro").textContent = "";
          atualizarVisao();
        } catch (e) { $("erro").textContent = e.message || String(e); }
      });
    }
    irPara(estado.aba);
  } catch (e) {
    $("erro").textContent = e.message || String(e);
    $("meta").textContent = "";
  }
}

iniciar();
</script>
